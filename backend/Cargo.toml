[package]
name = "furniture-buyer-api"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
jsonwebtoken = "9"
argon2 = { version = "0.5", features = ["std"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
dotenvy = "0.15"
thiserror = "2"
env_logger = "0.11"
log = "0.4"

[profile.dev]
# Hackathon builds: prefer fast iteration over optimised binaries.
opt-level = 0
debug = 1
